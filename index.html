<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>EREN TAKSİ V2</title><style>body{font-family:system-ui;background:#151515;color:white;margin:0;padding:18px;max-width:650px;margin:auto}h1{color:#facc15}button{background:#facc15;color:#111;border:0;border-radius:10px;padding:13px;font-weight:bold;cursor:pointer}input{box-sizing:border-box;width:100%;padding:13px;margin:6px 0 12px;border-radius:9px;border:1px solid #555;background:#292929;color:white}section,.tile{background:#292929;border-radius:14px;padding:15px;margin:12px 0}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{margin:0}small{color:#ccc}.value{font-size:23px;font-weight:bold}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1}article{border-bottom:1px solid #555;padding:10px 0}article button{padding:7px;margin-left:5px}label{display:block}#notice{color:#facc15} .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls>*{flex:1;min-width:110px}select{background:#292929;color:white;border:1px solid #666;padding:12px;border-radius:9px} .reportrow{padding:12px 0;border-bottom:1px solid #555}.muted{color:#bbb} .value.negative{color:#ff8b8b} </style></head><body><h1>🚕 EREN TAKSİ <small>V2</small></h1><small>Günlük Kasa ve Kazanç Takibi</small><section><small>Toplam Kasa Bakiyesi</small><div class="value" id="balance"></div></section><div class="tiles"><div class="tile"><small>Bugünkü Gelir</small><div class="value" id="income"></div></div><div class="tile"><small>Bugünkü Gider</small><div class="value" id="expense"></div></div><div class="tile"><small>Bugünkü Net</small><div class="value" id="net"></div></div><div class="tile"><small>Bugünkü İş Sayısı</small><div class="value" id="count"></div></div></div><nav><button onclick="show('trip')">+ Yeni İş</button><button onclick="show('cost')">− Gider</button><button onclick="show('history')">Geçmiş</button><button onclick="show('report')">Rapor</button></nav><p id="notice"></p><section id="trip" hidden><h2>Yeni İş</h2><label>Yolculuk tarihi ve saati<input id="tripDate" type="datetime-local" required></label><form id="tripForm"><label>Alış noktası<input id="from" required></label><label>Varış noktası<input id="to" required></label><label>Kazanılan tutar (TL)<input id="fare" type="number" min="0.01" step="0.01" required></label><button>İşi Kaydet</button></form></section><section id="cost" hidden><h2>Gider Ekle</h2><label>Gider tarihi ve saati<input id="costDate" type="datetime-local" required></label><form id="costForm"><label>Gider açıklaması<input id="description" required></label><label>Gider tutarı (TL)<input id="costAmount" type="number" min="0.01" step="0.01" required></label><button>Gideri Kaydet</button></form></section><section id="history" hidden><h2>İşlem Geçmişi</h2><label>Güne göre filtrele (boşsa tüm kayıtlar)<input id="historyDate" type="date" onchange="render()"></label><div id="records"></div></section><section id="report" hidden><h2>Raporlar</h2><div class="controls"><label>Dönem<select id="reportPeriod" onchange="updateReportControls();render()"><option value="day">Günlük</option><option value="week">Haftalık</option><option value="month" selected>Aylık</option><option value="year">Yıllık</option></select></label><label>Rapor tarihi<input type="date" id="reportDate" onchange="render()"></label></div><div id="reports"></div><h3>Veri Yedeği</h3><button onclick="backup()">Yedek İndir (JSON)</button><p><label>Yedekten geri yükle<input type="file" id="restore" accept="application/json,.json"></label></p><small>Geri yükleme mevcut kayıtları değiştirir. Yedek dosyanızı güvenli yerde saklayın.</small></section><script>
const KEY='eren-taksi-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{data=[]}if(!Array.isArray(data))data=[];
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n),pad=n=>String(n).padStart(2,'0');
const localDay=d=>{let x=new Date(d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const localDateTime=d=>{let x=new Date(d);return `${localDay(x)}T${pad(x.getHours())}:${pad(x.getMinutes())}`};
const today=()=>localDay(new Date());const validDate=v=>v&&!Number.isNaN(new Date(v).getTime());
function dateFromInput(id){let v=$(id).value;if(!validDate(v))throw Error('Geçerli tarih ve saat gir.');return new Date(v).toISOString()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Kayıt saklanamadı: '+e.message);return}render()}
function show(id){for(const k of ['trip','cost','history','report'])$(k).hidden=k!==id;if(id==='trip')$('tripDate').value=localDateTime(new Date());if(id==='cost')$('costDate').value=localDateTime(new Date());render()}
function add(type,description,amount,date){let n=Number(amount);if(!description.trim()||!Number.isFinite(n)||n<=0)return alert('Açıklama ve pozitif tutar gerekli.');data.push({id:crypto.randomUUID(),type,description:description.trim(),amount:n,date});save();$('notice').textContent='Kayıt eklendi.';show('history')}
$('tripForm').onsubmit=e=>{e.preventDefault();try{add('income',$('from').value.trim()+' → '+$('to').value.trim(),$('fare').value,dateFromInput('tripDate'));e.target.reset()}catch(err){alert(err.message)}};
$('costForm').onsubmit=e=>{e.preventDefault();try{add('expense',$('description').value,$('costAmount').value,dateFromInput('costDate'));e.target.reset()}catch(err){alert(err.message)}};
function remove(id){if(confirm('Bu kayıt silinsin mi?')){data=data.filter(x=>x.id!==id);save()}}
function edit(id){const x=data.find(x=>x.id===id);if(!x)return;const desc=prompt('Açıklama / güzergâh',x.description);if(desc===null)return;if(!desc.trim())return alert('Açıklama boş olamaz.');const amount=prompt('Tutar (TL)',x.amount);if(amount===null)return;const n=Number(amount.replace?.(',','.')??amount);if(!Number.isFinite(n)||n<=0)return alert('Geçerli tutar gir.');const dt=prompt('Tarih ve saat (YYYY-AA-GG SS:DD)',localDateTime(x.date).replace('T',' '));if(dt===null)return;const d=new Date(dt.trim().replace(' ','T'));if(!validDate(d))return alert('Geçersiz tarih.');x.description=desc.trim();x.amount=n;x.date=d.toISOString();save()}
const sum=(arr,type)=>arr.filter(x=>x.type===type).reduce((s,x)=>s+Number(x.amount),0);
function stats(a){let income=sum(a,'income'),expense=sum(a,'expense');return {income,expense,net:income-expense,count:a.filter(x=>x.type==='income').length}}
function statLine(a){let s=stats(a);return `Gelir ${money(s.income)} | Gider ${money(s.expense)} | Net ${money(s.net)} | İş ${s.count}`}
function updateReportControls(){$('reportDate').value||($('reportDate').value=today())}
function render(){let current=data.filter(x=>localDay(x.date)===today()),s=stats(current);$('income').textContent=money(s.income);$('expense').textContent=money(s.expense);$('net').textContent=money(s.net);$('balance').textContent=money(stats(data).net);$('count').textContent=s.count;
const records=$('records');records.replaceChildren();const filter=$('historyDate').value;for(const x of [...data].filter(x=>!filter||localDay(x.date)===filter).sort((a,b)=>b.date.localeCompare(a.date))){const a=document.createElement('article'),t=document.createElement('div');t.textContent=`${new Date(x.date).toLocaleString('tr-TR')} • ${x.description} • ${x.type==='income'?'+':'−'}${money(x.amount)}`;a.append(t);for(const [label,fn] of [['Düzenle',()=>edit(x.id)],['Sil',()=>remove(x.id)]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;a.append(b)}records.append(a)}if(!records.children.length)records.textContent='Bu tarihte kayıt bulunamadı.';
const period=$('reportPeriod').value,selected=$('reportDate').value||today(),anchor=new Date(selected+'T12:00:00');let start=new Date(anchor),finish=new Date(anchor);start.setHours(0,0,0,0);if(period==='week'){start.setDate(start.getDate()-((start.getDay()+6)%7));finish=new Date(start);finish.setDate(finish.getDate()+7)}else if(period==='month'){start.setDate(1);finish=new Date(start);finish.setMonth(finish.getMonth()+1)}else if(period==='year'){start.setMonth(0,1);finish=new Date(start);finish.setFullYear(finish.getFullYear()+1)}else finish.setDate(finish.getDate()+1);
const selectedRows=data.filter(x=>new Date(x.date)>=start&&new Date(x.date)<finish),before=data.filter(x=>new Date(x.date)<start),r=$('reports');r.replaceChildren();const header=document.createElement('p');header.textContent=`Dönem: ${localDay(start)} – ${localDay(new Date(finish.getTime()-86400000))}`;r.append(header);const summary=document.createElement('p');summary.textContent=statLine(selectedRows);r.append(summary);const carry=document.createElement('p');carry.textContent=`Devreden kasa: ${money(stats(before).net)} | Dönem sonu kasa: ${money(stats(before).net+stats(selectedRows).net)}`;r.append(carry);
if(period==='day'){const title=document.createElement('h3');title.textContent='Günün tüm işlemleri';r.append(title);for(const x of selectedRows.sort((a,b)=>a.date.localeCompare(b.date))){let row=document.createElement('div');row.className='reportrow';row.textContent=`${new Date(x.date).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} • ${x.description} • ${x.type==='income'?'+':'−'}${money(x.amount)}`;r.append(row)}}else{const title=document.createElement('h3');title.textContent=period==='year'?'Ay ay döküm':'Gün gün döküm';r.append(title);let cursor=new Date(start);while(cursor<finish){let next=new Date(cursor);if(period==='year')next.setMonth(next.getMonth()+1);else next.setDate(next.getDate()+1);let rows=selectedRows.filter(x=>new Date(x.date)>=cursor&&new Date(x.date)<next),row=document.createElement('div');row.className='reportrow';const btn=document.createElement('button');btn.textContent=period==='year'?cursor.toLocaleDateString('tr-TR',{month:'long',year:'numeric'}):cursor.toLocaleDateString('tr-TR');btn.onclick=()=>{$('reportPeriod').value=period==='year'?'month':'day';$('reportDate').value=localDay(cursor);render()};row.append(btn,document.createTextNode(' '+statLine(rows)));r.append(row);cursor=next}}
}
function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eren-taksi-yedek-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('restore').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const rows=JSON.parse(await file.text());if(!Array.isArray(rows)||!rows.every(x=>typeof x.id==='string'&&['income','expense'].includes(x.type)&&typeof x.description==='string'&&Number.isFinite(x.amount)&&x.amount>0&&validDate(x.date)))throw Error('Geçersiz yedek');if(confirm('Mevcut tüm kayıtlar yedekteki kayıtlarla değiştirilsin mi?')){data=rows;save()}}catch(err){alert('Yedek okunamadı: '+err.message)}e.target.value=''};
$('reportDate').value=today();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
