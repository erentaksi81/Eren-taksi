<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>EREN TAKSİ</title><style>body{font-family:system-ui;background:#151515;color:white;margin:0;padding:18px;max-width:650px;margin:auto}h1{color:#facc15}button{background:#facc15;color:#111;border:0;border-radius:10px;padding:13px;font-weight:bold;cursor:pointer}input{box-sizing:border-box;width:100%;padding:13px;margin:6px 0 12px;border-radius:9px;border:1px solid #555;background:#292929;color:white}section,.tile{background:#292929;border-radius:14px;padding:15px;margin:12px 0}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{margin:0}small{color:#ccc}.value{font-size:23px;font-weight:bold}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1}article{border-bottom:1px solid #555;padding:10px 0}article button{padding:7px;margin-left:5px}label{display:block}#notice{color:#facc15}</style></head><body><h1>🚕 EREN TAKSİ</h1><small>Günlük Kasa ve Kazanç Takibi</small><section><small>Toplam Kasa Bakiyesi</small><div class="value" id="balance"></div></section><div class="tiles"><div class="tile"><small>Bugünkü Gelir</small><div class="value" id="income"></div></div><div class="tile"><small>Bugünkü Gider</small><div class="value" id="expense"></div></div><div class="tile"><small>Bugünkü Net</small><div class="value" id="net"></div></div><div class="tile"><small>Bugünkü İş Sayısı</small><div class="value" id="count"></div></div></div><nav><button onclick="show('trip')">+ Yeni İş</button><button onclick="show('cost')">− Gider</button><button onclick="show('history')">Geçmiş</button><button onclick="show('report')">Rapor</button></nav><p id="notice"></p><section id="trip" hidden><h2>Yeni İş</h2><form id="tripForm"><label>Alış noktası<input id="from" required></label><label>Varış noktası<input id="to" required></label><label>Kazanılan tutar (TL)<input id="fare" type="number" min="0.01" step="0.01" required></label><button>İşi Kaydet</button></form></section><section id="cost" hidden><h2>Gider Ekle</h2><form id="costForm"><label>Gider açıklaması<input id="description" required></label><label>Gider tutarı (TL)<input id="costAmount" type="number" min="0.01" step="0.01" required></label><button>Gideri Kaydet</button></form></section><section id="history" hidden><h2>İşlem Geçmişi</h2><div id="records"></div></section><section id="report" hidden><h2>Raporlar</h2><div id="reports"></div><h3>Veri Yedeği</h3><button onclick="backup()">Yedek İndir (JSON)</button><p><label>Yedekten geri yükle<input type="file" id="restore" accept="application/json,.json"></label></p><small>Geri yükleme mevcut kayıtları değiştirir. Yedek dosyanızı güvenli yerde saklayın.</small></section><script>
const KEY='eren-taksi-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{data=[]}if(!Array.isArray(data))data=[];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n);const day=d=>new Date(d).toLocaleDateString('sv-SE');const today=()=>day(new Date());function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function show(id){for(const k of ['trip','cost','history','report'])document.getElementById(k).hidden=k!==id;render()}function add(type,description,amount){data.push({id:crypto.randomUUID(),type,description,amount:Number(amount),date:new Date().toISOString()});save();document.getElementById('notice').textContent='Kayıt eklendi.';show('history')}document.getElementById('tripForm').onsubmit=e=>{e.preventDefault();add('income',document.getElementById('from').value.trim()+' → '+document.getElementById('to').value.trim(),document.getElementById('fare').value);e.target.reset()};document.getElementById('costForm').onsubmit=e=>{e.preventDefault();add('expense',document.getElementById('description').value.trim(),document.getElementById('costAmount').value);e.target.reset()};function remove(id){if(confirm('Bu kayıt silinsin mi?')){data=data.filter(x=>x.id!==id);save()}}function edit(id){const x=data.find(x=>x.id===id);if(!x)return;const desc=prompt('Açıklama / güzergâh',x.description);if(desc===null||!desc.trim())return;const amount=prompt('Tutar (TL)',x.amount);if(amount===null||!Number.isFinite(Number(amount))||Number(amount)<=0)return;x.description=desc.trim();x.amount=Number(amount);save()}function render(){const sum=(arr,type)=>arr.filter(x=>x.type===type).reduce((s,x)=>s+x.amount,0);const current=data.filter(x=>day(x.date)===today());const i=sum(current,'income'),e=sum(current,'expense');document.getElementById('income').textContent=money(i);document.getElementById('expense').textContent=money(e);document.getElementById('net').textContent=money(i-e);document.getElementById('balance').textContent=money(sum(data,'income')-sum(data,'expense'));document.getElementById('count').textContent=current.filter(x=>x.type==='income').length;const records=document.getElementById('records');records.replaceChildren();for(const x of [...data].sort((a,b)=>b.date.localeCompare(a.date))){const a=document.createElement('article');const t=document.createElement('div');t.textContent=`${new Date(x.date).toLocaleString('tr-TR')} • ${x.description} • ${x.type==='income'?'+':'−'}${money(x.amount)}`;a.append(t);for(const [label,fn] of [['Düzenle',()=>edit(x.id)],['Sil',()=>remove(x.id)]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;a.append(b)}records.append(a)}const now=new Date();const startWeek=new Date(now);startWeek.setHours(0,0,0,0);startWeek.setDate(now.getDate()-((now.getDay()+6)%7));const ranges=[['Bugün',x=>day(x.date)===today()],['Bu hafta',x=>new Date(x.date)>=startWeek],['Bu ay',x=>{const d=new Date(x.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}],['Bu yıl',x=>new Date(x.date).getFullYear()===now.getFullYear()]];document.getElementById('reports').replaceChildren(...ranges.map(([name,filter])=>{const a=data.filter(filter),p=document.createElement('p');p.textContent=`${name}: Gelir ${money(sum(a,'income'))} | Gider ${money(sum(a,'expense'))} | Net ${money(sum(a,'income')-sum(a,'expense'))} | İş ${a.filter(x=>x.type==='income').length}`;return p}))}function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eren-taksi-yedek-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('restore').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const rows=JSON.parse(await file.text());if(!Array.isArray(rows)||!rows.every(x=>typeof x.id==='string'&&['income','expense'].includes(x.type)&&typeof x.description==='string'&&Number.isFinite(x.amount)&&x.amount>0&&typeof x.date==='string'&&!Number.isNaN(Date.parse(x.date))))throw Error('Geçersiz yedek');if(confirm('Mevcut tüm kayıtlar yedekteki kayıtlarla değiştirilsin mi?')){data=rows;save()}}catch(err){alert('Yedek okunamadı: '+err.message)}e.target.value=''};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
